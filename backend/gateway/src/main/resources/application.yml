server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: finvault-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finvault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:finvault}
    password: ${SPRING_DATASOURCE_PASSWORD:finvault_pass}
    hikari:
      pool-name: FinVaultHikari
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    issuer: ${APP_JWT_ISSUER:finvault}
    access-token-minutes: ${APP_JWT_ACCESS_TOKEN_MINUTES:15}
  reports:
    weekly-cron: ${APP_REPORTS_WEEKLY_CRON:0 0 8 ? * MON}
